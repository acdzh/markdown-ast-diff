<html><head><style>
ins { background-color: #e6ffec; text-decoration: none; border-radius: 2px; padding: 0 2px; }
del { background-color: #ffebe9; text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
ins.diff-block, del.diff-block { display: block; padding-left: 10px; border-left: 3px solid; }
ins.diff-block { border-left-color: #2cbe4e; }
del.diff-block { border-left-color: #cb2431; }
ins > hr, ins > pre { background-color: #e6ffec; }
del > hr, del > pre { background-color: #ffebe9; }
li[data-diff="ins"] { background-color: #e6ffec; border-radius: 2px; }
li[data-diff="del"] { background-color: #ffebe9; border-radius: 2px; text-decoration: line-through; }
</style></head><body><h1>表格示例</h1>
<h2>简单表格</h2>
<table>
<thead>
<tr>
<th>姓名</th>
<th>年龄</th>
<th>职业</th>
</tr>
</thead>
<tbody>
<tr>
<td>张三</td>
<td>25</td>
<td>工程师</td>
</tr>
<tr>
<td>李四</td>
<td>30</td>
<td>设计师</td>
</tr>
<tr>
<td>王五</td>
<td>28</td>
<td>产品经理</td>
</tr>
</tbody>
</table>
<h2>对齐方式</h2>
<table>
<thead>
<tr>
<th align="left">左对齐</th>
<th align="center">居中</th>
<th align="right">右对齐</th>
</tr>
</thead>
<tbody>
<tr>
<td align="left">内容1</td>
<td align="center">内容2</td>
<td align="right">内容3</td>
</tr>
<tr>
<td align="left">长文本内容</td>
<td align="center">长文本内容</td>
<td align="right">长文本内容</td>
</tr>
</tbody>
</table>
<h2>复杂表格</h2>
<table>
<thead>
<tr>
<th>项目</th>
<th>Q1</th>
<th>Q2</th>
<th>Q3</th>
<th>Q4</th>
<th>总计</th>
</tr>
</thead>
<tbody>
<tr>
<td>收入</td>
<td>10,000</td>
<td>12,000</td>
<td>15,000</td>
<td>18,000</td>
<td>55,000</td>
</tr>
<tr>
<td>支出</td>
<td>8,000</td>
<td>9,000</td>
<td>10,000</td>
<td>12,000</td>
<td>39,000</td>
</tr>
<tr>
<td>利润</td>
<td>2,000</td>
<td>3,000</td>
<td>5,000</td>
<td>6,000</td>
<td>16,000</td>
</tr>
</tbody>
</table></body></html>
