<html><head><style>
ins { background-color: #e6ffec; text-decoration: none; border-radius: 2px; padding: 0 2px; }
del { background-color: #ffebe9; text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
ins.diff-block, del.diff-block { display: block; padding-left: 10px; border-left: 3px solid; }
ins.diff-block { border-left-color: #2cbe4e; }
del.diff-block { border-left-color: #cb2431; }
ins > hr, ins > pre { background-color: #e6ffec; }
del > hr, del > pre { background-color: #ffebe9; }
li[data-diff="ins"] { background-color: #e6ffec; border-radius: 2px; }
li[data-diff="del"] { background-color: #ffebe9; border-radius: 2px; text-decoration: line-through; }
</style></head><body><h1>文本格式化示例</h1>
<h2>基本格式</h2>
<p>11</p>
<p>22</p>
<p>这是<strong>粗体</strong>文本。</p>
<h3>123</h3>
<p>这是<em>斜体</em>文本。</p>
<p>这是<em><strong>粗斜体</strong></em>文本。</p>
<p>这是<del>删除线</del>文本。</p>
<p>这是<code>行内代码</code>。</p>
<h2>引用</h2>
<blockquote>
<p>这是一级引用</p>
<blockquote>
<p>这是嵌套引用</p>
<blockquote>
<p>这是三级引用</p>
</blockquote>
</blockquote>
</blockquote>
<h2>水平线</h2>
<hr>
<h2>脚注</h2>
<p>这里有一个脚注<sup><a href="#user-content-fn-1" id="user-content-fnref-1" data-footnote-ref aria-describedby="footnote-label">1</a></sup>。</p>
<h2>特殊字符</h2>
<p>这里展示一些特殊字符：**非粗体**，`非代码`。</p>
<h2>混合格式</h2>
<p>这段文字<strong>包含<em>混合的</em>格式</strong>，还有<del>一些</del><code>代码</code>。</p>
<section data-footnotes class="footnotes"><h2 class="sr-only" id="footnote-label">Footnotes</h2>
<ol>
<li id="user-content-fn-1">
<p>这是脚注内容。 <a href="#user-content-fnref-1" data-footnote-backref="" aria-label="Back to reference 1" class="data-footnote-backref">↩</a></p>
</li>
</ol>
</section></body></html>
