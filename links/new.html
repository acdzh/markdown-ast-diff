<html><head><style>
ins { background-color: #e6ffec; text-decoration: none; border-radius: 2px; padding: 0 2px; }
del { background-color: #ffebe9; text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
ins.diff-block, del.diff-block { display: block; padding-left: 10px; border-left: 3px solid; }
ins.diff-block { border-left-color: #2cbe4e; }
del.diff-block { border-left-color: #cb2431; }
ins > hr, ins > pre { background-color: #e6ffec; }
del > hr, del > pre { background-color: #ffebe9; }
li[data-diff="ins"] { background-color: #e6ffec; border-radius: 2px; }
li[data-diff="del"] { background-color: #ffebe9; border-radius: 2px; text-decoration: line-through; }
</style></head><body><h1>链接和图片示例（更新版）</h1>
<h2>链接</h2>
<p>这是一个<a href="https://example.org">更新的内联链接</a>。</p>
<p>这是一个<a href="https://example.com" title="更新后的示例网站">带标题的链接</a>。</p>
<p>这是一个<a href="https://example.org/reference" title="更新的参考链接">参考链接</a>和一个<a href="https://example.com/new-reference" title="新增的参考链接">新增的参考链接</a>。</p>
<h2>图片</h2>
<p><img src="https://example.org/updated-image.jpg" alt="更新的示例图片"></p>
<p><img src="https://example.com/image.jpg" alt="带标题的图片" title="更新后的示例图片标题"></p>
<p><img src="https://example.org/reference-image.jpg" alt="参考图片" title="更新的参考图片标题"></p>
<p><img src="https://example.com/new-reference-image.jpg" alt="新增的参考图片" title="新增的参考图片标题"></p>
<h2>链接列表</h2>
<ul>
<li><a href="https://github.com">GitHub</a></li>
<li><a href="https://microsoft.com">Microsoft</a></li>
<li><a href="https://google.com">Google</a></li>
<li><a href="https://baidu.com">百度</a></li>
<li><a href="https://example.com/new">新增链接</a></li>
</ul>
<h2>图文混排</h2>
<p><a href="https://example.org"><img src="https://example.org/linked-image.jpg" alt="更新的带链接的图片"></a></p>
<p>这段更新后的文字包含一个<a href="https://example.org">更新的链接</a>和一个<img src="https://example.org/inline-image.jpg" alt="更新的内联图片">。</p>
<p>新增的段落，包含一个<a href="https://example.com/new">新链接</a>。</p></body></html>
