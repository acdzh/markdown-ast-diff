<html><head><style>
ins { background-color: #e6ffec; text-decoration: none; border-radius: 2px; padding: 0 2px; }
del { background-color: #ffebe9; text-decoration: line-through; border-radius: 2px; padding: 0 2px; }
ins.diff-block, del.diff-block { display: block; padding-left: 10px; border-left: 3px solid; }
ins.diff-block { border-left-color: #2cbe4e; }
del.diff-block { border-left-color: #cb2431; }
ins > hr, ins > pre { background-color: #e6ffec; }
del > hr, del > pre { background-color: #ffebe9; }
li[data-diff="ins"] { background-color: #e6ffec; border-radius: 2px; }
li[data-diff="del"] { background-color: #ffebe9; border-radius: 2px; text-decoration: line-through; }
</style></head><body><del class="diff-block"><h1>列表示例</h1></del>
<ins class="diff-block"><h1>列表示例（更新版）</h1></ins>
<h2>无序列表</h2>
<ul>
<li>项目 1</li>
<li><ins class="diff-inline">新增</ins>项目<del class="diff-inline"> 2</del></li>
<li>项目 3
<ul>
<li>子项目 3.1</li>
<li data-diff="ins">新增子项目</li>
<li>子项目 3.2</li>
</ul>
</li>
<li>项目 <del class="diff-inline">4</del><ins class="diff-inline">5</ins></li>
</ul>
<h2>有序列表</h2>
<ol>
<li data-diff="del">第一步</li>
<li data-diff="ins">第一步（已修改）</li>
<li>第二步</li>
<li data-diff="ins">新增步骤</li>
<li>第三步
<ol>
<li>子步骤 3.1</li>
<li>子步骤 3.2</li>
<li data-diff="ins">新增子步骤</li>
</ol>
</li>
<li>第四步</li>
</ol>
<h2>任务列表</h2>
<ul class="contains-task-list">
<li class="task-list-item" data-diff="del"><input type="checkbox" disabled> 待办任务 1</li>
<li class="task-list-item" data-diff="ins"><input type="checkbox" checked disabled> 待办任务 1（已完成）</li>
<li class="task-list-item"><input type="checkbox" checked disabled> 已完成任务 2</li>
<li class="task-list-item" data-diff="ins"><input type="checkbox" disabled> 新增待办任务</li>
<li class="task-list-item"><input type="checkbox" disabled> 待办任务 3</li>
</ul></body></html>
