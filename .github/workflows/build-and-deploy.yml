# Workflow for building and deploying the markdown-ast-diff library and demos to GitHub Pages
name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Allow manual triggering

# Add permissions for deployment
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }} # Prevents overlapping deployments

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify install
      run: ls node_modules/.bin/tsx && ls node_modules/.bin/tsup && ls node_modules/.bin/vite

    - name: Run tests
      run: npm test

    - name: Build library
      run: npm run build

    - name: Build preview
      run: npm run build:preview

    - name: Deploy Node Tests to GitHub Pages
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: test/node/output
        branch: output-preview
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy Browser Demo to GitHub Pages
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: test/browser/output
        branch: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}
